name: Deploy Apps Script backend

# Optional. Pushes apps-script/ to Google and updates the existing web app deployment,
# so the API URL (and the printed QR code) never change.
# Needs 3 repository secrets: CLASPRC_JSON, SCRIPT_ID, DEPLOYMENT_ID (see README).

on:
  push:
    branches: [main]
    paths: ["apps-script/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - name: Skip when secrets are not set
        if: env.CLASPRC_JSON == '' || env.SCRIPT_ID == ''
        run: echo "::notice::Apps Script secrets not configured, skipping. Deploy from the Apps Script editor instead (README)."
      - uses: actions/checkout@v4
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
        with:
          node-version: 20
      - name: Push and deploy
        if: env.CLASPRC_JSON != '' && env.SCRIPT_ID != ''
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          clasp push -f
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
          else
            echo "::warning::DEPLOYMENT_ID not set: code pushed but the live web app was not updated."
          fi
